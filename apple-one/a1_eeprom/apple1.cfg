#
# prog.cfg - cc65 C program for a 32K A-ONE
#
# $0000-$0023  cc65 zero page (Woz Monitor uses $24-$2B, left alone)
# $0280-...    STARTUP, ONCE, CODE, RODATA, DATA, INIT, BSS
# ...-$7FFF    C software stack (__STACKSIZE__ bytes)
#

SYMBOLS {
    __LOAD__:      type = weak, value = $0280;
    __STACKSIZE__: type = weak, value = $0200;
}

MEMORY {
    ZP:  file = "", start = $0000, size = $0024, type = rw, define = yes;
    RAM: file = %O, start = __LOAD__, size = $8000 - __STACKSIZE__ - __LOAD__, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    EXTZP:    load = ZP,  type = zp,  optional = yes;
    STARTUP:  load = RAM, type = ro,  optional = yes;
    ONCE:     load = RAM, type = ro,  optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro,  optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    INIT:     load = RAM, type = rw,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes, define = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
